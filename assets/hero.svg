<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="StillAir — temperature and throttle rank in the menu bar.">
  <defs>
    <!-- Near-black keynote stage -->
    <radialGradient id="stage" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="65%" stop-color="#0b0b0d"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>

    <!-- Ice accent for the thermometer -->
    <linearGradient id="ice" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfe8ff"/>
      <stop offset="100%" stop-color="#64d2ff"/>
    </linearGradient>

    <!-- Red pressure glow -->
    <radialGradient id="heatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff453a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff453a" stop-opacity="0"/>
    </radialGradient>

    <!-- Wordmark glow -->
    <filter id="wordGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Stage -->
  <rect width="1200" height="320" fill="url(#stage)"/>
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">

    <!-- ==================== The menu bar, full width ====================
         The product in its real context. Nothing else. -->
    <rect x="0" y="0" width="1200" height="52" fill="#1c1c1f"/>
    <line x1="0" y1="52" x2="1200" y2="52" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>

    <!-- App menu name -->
    <text x="28" y="33" font-size="15" font-weight="700" fill="#f5f5f7">StillAir</text>

    <!-- Menus -->
    <text x="112" y="33" font-size="13" fill="#a1a1a6">File</text>
    <text x="152" y="33" font-size="13" fill="#a1a1a6">Edit</text>
    <text x="192" y="33" font-size="13" fill="#a1a1a6">View</text>
    <text x="236" y="33" font-size="13" fill="#a1a1a6">Window</text>
    <text x="300" y="33" font-size="13" fill="#a1a1a6">Help</text>

    <!-- Menu bar extras, right-aligned, native macOS spacing -->
    <g transform="translate(0, 0)">
      <!-- wifi -->
      <g transform="translate(1040, 26)" stroke="#d1d1d6" stroke-width="1.6" stroke-linecap="round" fill="none">
        <path d="M -9,2 A 12,12 0 0 1 9,2"/>
        <path d="M -5.5,2 A 8.5,8.5 0 0 1 5.5,2" opacity="0.85"/>
        <path d="M -2,2 A 5,5 0 0 1 2,2" opacity="0.7"/>
        <circle cx="0" cy="6.5" r="1.5" fill="#d1d1d6" stroke="none"/>
      </g>

      <!-- battery -->
      <g transform="translate(1084, 26)">
        <rect x="-11" y="-7" width="22" height="14" rx="4" fill="none" stroke="#d1d1d6" stroke-width="1.4"/>
        <rect x="11" y="-3" width="2.5" height="6" rx="1" fill="#d1d1d6"/>
        <rect x="-8" y="-4" width="12" height="8" rx="1.5" fill="#d1d1d6"/>
      </g>

      <!-- control center -->
      <g transform="translate(1128, 26)" stroke="#d1d1d6" stroke-width="1.5" fill="none">
        <rect x="-9" y="-8" width="18" height="16" rx="5"/>
        <path d="M -4,-8 L -4,-3 M 4,-8 L 4,-3 M -9,1 L -4,1 M 4,1 L 9,1" stroke-width="2" opacity="0.85"/>
      </g>

      <!-- hairline before the StillAir readout -->
      <line x1="1152" y1="12" x2="1152" y2="40" stroke="#48484a" stroke-width="1"/>

      <!-- ============ THE READOUT: thermometer + temp + rank ============ -->
      <g transform="translate(1160, 26)">
        <!-- thermometer glyph -->
        <g transform="translate(-26, 0)" stroke="url(#ice)" stroke-width="2.6" stroke-linecap="round" fill="none">
          <line x1="0" y1="-12" x2="0" y2="5"/>
          <circle cx="0" cy="9" r="5" fill="url(#ice)" stroke="none"/>
        </g>

        <!-- temperature: 64° → 68° → 72° → 76° → back. Color follows pressure, not °C. -->
        <g font-size="15" font-weight="600">
          <text x="-12" y="5" fill="#f5f5f7" opacity="1">64°<animate attributeName="opacity" values="1;0;0;0;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/></text>
          <text x="-12" y="5" fill="#f5f5f7" opacity="0">68°<animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/></text>
          <text x="-12" y="5" fill="#f5f5f7" opacity="0">72°<animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/></text>
          <text x="-12" y="5" fill="#ff453a" opacity="0">76°<animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/></text>
          <text x="-12" y="5" fill="#f5f5f7" opacity="0">72°<animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/></text>
          <text x="-12" y="5" fill="#f5f5f7" opacity="0">68°<animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/></text>
        </g>

        <!-- rank chip — 6px radius per HIG small-control guidance; appears only under pressure -->
        <g font-size="11" font-weight="700">
          <rect x="6" y="-10" width="20" height="20" rx="6" fill="#ff453a" opacity="0">
            <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/>
          </rect>
          <text x="16" y="5" text-anchor="middle" fill="#ffffff" opacity="0">4<animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/></text>
        </g>

        <!-- pressure glow behind readout while throttling -->
        <circle cx="-5" r="42" fill="url(#heatGlow)" opacity="0">
          <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- ==================== Headline, left-aligned ==================== -->
    <text x="64" y="196" font-size="100" font-weight="700" letter-spacing="-4" fill="#f5f5f7" filter="url(#wordGlow)">StillAir</text>
    <text x="66" y="240" font-size="22" font-weight="500" fill="#86868b">See when your Air throttles.</text>

    <!-- Small caps footnote -->
    <text x="66" y="304" font-size="12" font-weight="600" letter-spacing="3" fill="#48484a">FREE&#160;&#160;·&#160;&#160;OPEN SOURCE&#160;&#160;·&#160;&#160;macOS 13+</text>
  </g>
</svg>
