<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="StillAir — temperature and throttle rank in the menu bar.">
  <defs>
    <!-- Near-black stage, like a keynote slide -->
    <radialGradient id="stage" cx="50%" cy="18%" r="85%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="60%" stop-color="#0b0b0d"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>

    <!-- One accent: the thermometer ice -->
    <linearGradient id="ice" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfe8ff"/>
      <stop offset="100%" stop-color="#64d2ff"/>
    </linearGradient>

    <!-- Soft red when the machine is under pressure -->
    <radialGradient id="heatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff453a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff453a" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle blur behind the wordmark -->
    <filter id="wordGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Stage -->
  <rect width="1200" height="320" fill="url(#stage)"/>

  <!-- Faint top hairline, like a keynote header rule -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- ======================== Wordmark ======================== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="600" y="138" text-anchor="middle" font-size="104" font-weight="700" letter-spacing="-4"
          fill="#f5f5f7" filter="url(#wordGlow)">StillAir</text>

    <text x="600" y="186" text-anchor="middle" font-size="22" font-weight="500" letter-spacing="0.2"
          fill="#86868b">See when your Air throttles.</text>

    <!-- ==================== The product, shown once ====================
         A single menu bar readout. Temperature. Rank. Nothing else. -->
    <g transform="translate(600, 258)">
      <!-- capsule -->
      <rect x="-170" y="-28" width="340" height="56" rx="14" fill="#1c1c1e">
        <animate attributeName="stroke" values="#2c2c2e;#2c2c2e;#2c2c2e;#ff453a;#ff453a;#2c2c2e;#2c2c2e"
                 keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/>
      </rect>
      <rect x="-170" y="-28" width="340" height="56" rx="14" fill="none" stroke="#2c2c2e" stroke-width="1.5">
        <animate attributeName="stroke" values="#2c2c2e;#2c2c2e;#2c2c2e;#ff453a;#ff453a;#2c2c2e;#2c2c2e"
                 keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/>
      </rect>
      <!-- heat glow behind capsule while throttling -->
      <circle r="95" fill="url(#heatGlow)">
        <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1"
                 dur="10s" repeatCount="indefinite"/>
      </circle>

      <!-- thermometer glyph -->
      <g transform="translate(-118, 0)" stroke="url(#ice)" stroke-width="3" stroke-linecap="round" fill="none">
        <line x1="0" y1="-14" x2="0" y2="6"/>
        <circle cx="0" cy="11" r="6" fill="url(#ice)" stroke="none"/>
      </g>

      <!-- temperature ticker: 64° → 68° → 72° → 76° → back. Color follows pressure, not °C. -->
      <g font-size="26" font-weight="600">
        <text x="-92" y="9" fill="#f5f5f7" opacity="0">64°<animate attributeName="opacity" values="1;0;0;0;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/></text>
        <text x="-92" y="9" fill="#f5f5f7" opacity="0">68°<animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/></text>
        <text x="-92" y="9" fill="#f5f5f7" opacity="0">72°<animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/></text>
        <text x="-92" y="9" fill="#ff453a" opacity="0">76°<animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/></text>
        <text x="-92" y="9" fill="#f5f5f7" opacity="0">72°<animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/></text>
        <text x="-92" y="9" fill="#f5f5f7" opacity="0">68°<animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/></text>
      </g>

      <!-- rank chip: appears only under pressure -->
      <g font-size="16" font-weight="700">
        <rect x="78" y="-14" width="28" height="28" rx="7" fill="#ff453a" opacity="0">
          <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/>
        </rect>
        <text x="92" y="7" text-anchor="middle" fill="#ffffff" opacity="0">4<animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.7;1" dur="10s" repeatCount="indefinite"/></text>
      </g>
    </g>

    <!-- Small caps footnote -->
    <text x="600" y="312" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="3"
          fill="#48484a">FREE&#160;&#160;·&#160;&#160;OPEN SOURCE&#160;&#160;·&#160;&#160;macOS 13+</text>
  </g>
</svg>
