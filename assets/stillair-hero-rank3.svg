<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="StillAir — a motionless feather suspended in calm air beside a live thermal-pressure readout.">
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2430"/>
      <stop offset="0.48" stop-color="#09151d"/>
      <stop offset="1" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="d-airline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64d2ff" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#64d2ff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#b8ecff" stop-opacity="0.48"/>
      <stop offset="0.78" stop-color="#64d2ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#64d2ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="d-feather" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4fbce9"/>
      <stop offset="0.58" stop-color="#9be4ff"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="d-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12232d" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#091117" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="d-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#64d2ff" stop-opacity="0.26"/>
      <stop offset="0.58" stop-color="#64d2ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#64d2ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="d-feather-glow" x="-50%" y="-30%" width="200%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="d-shadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#d-bg)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.25" fill="none" stroke="#8ee3ff" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- Still air: perfectly level atmospheric layers and fixed particles. -->
  <g>
    <ellipse cx="157" cy="157" rx="158" ry="153" fill="url(#d-halo)"/>
    <g stroke="url(#d-airline)" stroke-width="1.2">
      <line x1="18" y1="72" x2="297" y2="72"/>
      <line x1="8" y1="103" x2="306" y2="103"/>
      <line x1="3" y1="134" x2="311" y2="134"/>
      <line x1="0" y1="165" x2="314" y2="165"/>
      <line x1="4" y1="196" x2="310" y2="196"/>
      <line x1="10" y1="227" x2="304" y2="227"/>
      <line x1="20" y1="258" x2="294" y2="258"/>
    </g>
    <g fill="#b7edff">
      <circle cx="69" cy="92" r="2" opacity="0.42"/>
      <circle cx="94" cy="147" r="1.6" opacity="0.58"/>
      <circle cx="64" cy="216" r="1.8" opacity="0.34"/>
      <circle cx="222" cy="82" r="1.7" opacity="0.46"/>
      <circle cx="252" cy="144" r="2" opacity="0.34"/>
      <circle cx="236" cy="229" r="1.6" opacity="0.52"/>
      <circle cx="286" cy="184" r="1.3" opacity="0.31"/>
    </g>
  </g>

  <!-- A single feather held motionless. Only its light breathes; its position never moves. -->
  <g filter="url(#d-feather-glow)" fill="none" stroke="url(#d-feather)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 252 C123 231 132 208 141 184 C152 154 161 124 169 95 C174 77 179 63 185 53" stroke-width="3.2"/>
    <path d="M112 249 C104 226 104 201 110 174 C118 139 135 108 159 79 C170 66 181 56 196 52 C201 75 199 99 191 124 C182 152 165 176 148 197 C132 216 120 234 112 249 Z" fill="#64d2ff" fill-opacity="0.055" stroke-width="1.4" stroke-opacity="0.7"/>

    <g stroke-width="2" stroke-opacity="0.74">
      <path d="M125 220 L101 220"/>
      <path d="M132 203 L94 197"/>
      <path d="M139 185 L96 173"/>
      <path d="M146 166 L103 148"/>
      <path d="M152 147 L115 124"/>
      <path d="M158 128 L129 102"/>
      <path d="M164 108 L145 84"/>
      <path d="M170 87 L164 70"/>
      <path d="M126 217 L158 204"/>
      <path d="M133 199 L173 181"/>
      <path d="M140 181 L187 155"/>
      <path d="M147 162 L194 132"/>
      <path d="M154 142 L198 108"/>
      <path d="M160 122 L198 87"/>
      <path d="M166 101 L194 68"/>
    </g>
    <animate attributeName="opacity" values="0.78;1;0.78" dur="4.8s" repeatCount="indefinite"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="318" y="141" font-size="82" font-weight="760" letter-spacing="-3.5"><tspan fill="#f5f7fa">Still</tspan><tspan fill="#91e4ff">Air</tspan></text>
    <text x="322" y="182" font-size="22" font-weight="520" fill="#9cbac7">See when your Air throttles.</text>
    <text x="322" y="220" font-size="11" font-weight="700" letter-spacing="2.4" fill="#527181">THERMAL PRESSURE, MADE VISIBLE</text>
    <text x="322" y="282" font-size="11" font-weight="650" letter-spacing="2.2" fill="#425b67">FOR FANLESS MACS  ·  FREE  ·  OPEN SOURCE</text>

    <!-- Compact product proof, kept secondary to the brand metaphor. -->
    <g transform="translate(826 42)" filter="url(#d-shadow)">
      <rect width="330" height="236" rx="14" fill="url(#d-panel)" stroke="#99e4ff" stroke-opacity="0.22"/>
      <text x="22" y="34" font-size="10" font-weight="750" letter-spacing="2" fill="#7493a0">THERMAL PRESSURE</text>
      <circle cx="302" cy="29" r="4.5" fill="#ff9f0a">
        <animate attributeName="opacity" values="0.62;1;0.62" dur="2.2s" repeatCount="indefinite"/>
      </circle>

      <text x="22" y="101" font-size="62" font-weight="720" letter-spacing="-2" fill="#f5f7fa">72°</text>
      <text x="147" y="98" font-size="13" font-weight="650" fill="#7f97a2">C</text>
      <rect x="230" y="61" width="76" height="42" rx="10" fill="#ff9f0a"/>
      <text x="268" y="87" text-anchor="middle" font-size="11" font-weight="800" letter-spacing="0.8" fill="#ffffff">RANK 3</text>

      <line x1="22" y1="123" x2="308" y2="123" stroke="#ffffff" stroke-opacity="0.11"/>
      <text x="22" y="149" font-size="9" font-weight="700" letter-spacing="1.7" fill="#667f8a">RANK SCALE</text>
      <g transform="translate(22 163)" font-size="10" font-weight="800" text-anchor="middle">
        <g transform="translate(14 14)"><rect x="-14" y="-14" width="28" height="28" rx="6" fill="#122933"/><text y="4" fill="#77d8ff">1</text></g>
        <g transform="translate(58 14)"><rect x="-14" y="-14" width="28" height="28" rx="6" fill="#172b32"/><text y="4" fill="#9cdce9">2</text></g>
        <g transform="translate(102 14)"><rect x="-14" y="-14" width="28" height="28" rx="6" fill="#ff9f0a"/><text y="4" fill="#ffffff">3</text></g>
        <g transform="translate(146 14)"><rect x="-14" y="-14" width="28" height="28" rx="6" fill="#2f1d1b"/><text y="4" fill="#a7605c">4</text></g>
        <g transform="translate(190 14)"><rect x="-14" y="-14" width="28" height="28" rx="6" fill="#2b1717"/><text y="4" fill="#a95b57">5</text></g>
      </g>
      <text x="22" y="222" font-size="10" font-weight="650" letter-spacing="1.1" fill="#536d78">TEMPERATURE  ·  PRESSURE  ·  HISTORY</text>
    </g>
  </g>
</svg>
